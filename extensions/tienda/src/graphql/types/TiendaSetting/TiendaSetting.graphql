extend type Setting {
  """
  Clave de navegador de Google Maps (Places API) para autocompletar direcciones.
  Es pública por diseño: se protege restringiéndola por dominio en Google Cloud.
  """
  googleMapsApiKey: String
  """
  Si está configurado el inicio de sesión con Google (GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET).
  """
  googleLoginEnabled: Boolean
}
