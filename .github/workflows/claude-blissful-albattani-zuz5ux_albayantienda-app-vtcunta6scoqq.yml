# Workflow creado por el Deployment Center de Azure y adaptado a la tienda:
# compila EverShop, el tema y las extensiones en GitHub y sube el paquete ya
# listo (scripts/build-package.sh). Sin este paso Azure recibiría el código
# fuente sin compilar y tendría que compilarlo al arrancar, en un B1.

name: Build and deploy Node.js app to Azure Web App - albayantienda-app-vtcunta6scoqq

on:
  push:
    branches:
      - claude/blissful-albattani-zuz5ux
      - main
  workflow_dispatch:

# Nunca dos despliegues a la vez sobre la misma Web App (Kudu rechaza el segundo).
concurrency:
  group: deploy-albayantienda
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Compilar, probar y empaquetar
        run: scripts/build-package.sh tienda.zip

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: tienda.zip
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'albayantienda-app-vtcunta6scoqq'
          slot-name: 'Production'
          package: tienda.zip
          clean: true
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B9D6939500924E64A728D2F9E2F19535 }}
