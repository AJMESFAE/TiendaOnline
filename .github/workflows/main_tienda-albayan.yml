# Compila y despliega la tienda en Azure App Service en cada push a main
# (mismo esquema que VillaDelCasar: Web App Linux Node 22 + startup.sh).
#
# Configuración única (la hace infra/setup-github.sh):
#   Secretos:  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   Variable:  AZURE_WEBAPP_NAME  (nombre de la Web App que creó deploy.sh)

name: Build and deploy Node.js app to Azure Web App - tienda-albayan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Compilar, probar y empaquetar
        run: scripts/build-package.sh tienda.zip

      - name: Upload artifact for deployment job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tienda
          path: tienda.zip
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write # necesario para el login OIDC con Azure
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: tienda

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: tienda.zip
          clean: true
